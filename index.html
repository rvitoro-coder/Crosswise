/* INTERLET signature orbital mark, copied from the actual Interlet identity */
.interlet-mark{position:relative;width:112px;height:74px;margin:0 auto;isolation:isolate}
.interlet-mark .planet-core{position:absolute;z-index:2;left:31px;top:7px;width:58px;height:58px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 31% 25%,#d8ccff 0 5%,#9b72ff 15%,#713cff 40%,#3d1a8b 72%,#160b35 100%);box-shadow:inset -10px -8px 18px rgba(9,4,25,.55),0 0 30px rgba(124,77,255,.28)}
.interlet-mark .planet-cut{position:absolute;inset:0;border-radius:50%;background:linear-gradient(155deg,transparent 0 45%,rgba(255,255,255,.09) 46% 49%,transparent 50% 61%,rgba(66,229,141,.16) 62% 65%,transparent 66%);transform:rotate(-8deg)}
.interlet-mark .orbit{position:absolute;left:8px;top:29px;width:99px;height:22px;border:3px solid #fff;border-radius:50%;transform:rotate(-14deg);box-sizing:border-box}
.interlet-mark .orbit-back{z-index:1;opacity:.72;border-color:#a98dff}
.interlet-mark .orbit-front{z-index:3;clip-path:inset(50% -8px -8px -8px);border-color:#fff;filter:drop-shadow(0 1px 2px rgba(255,255,255,.16))}
.interlet-mark .moon{position:absolute;z-index:4;right:2px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--signal);box-shadow:0 0 12px rgba(66,229,141,.5)}
.interlet-mark .spark{position:absolute;z-index:0;background:#fff;transform:rotate(45deg);opacity:.85}
.interlet-mark .spark-a{width:4px;height:4px;left:10px;top:10px}.interlet-mark .spark-b{width:3px;height:3px;right:13px;bottom:8px;background:var(--signal);opacity:.7}
html.light .interlet-mark .orbit-front{border-color:#211a38}html.light .interlet-mark .orbit-back{border-color:#7c4dff}html.light .interlet-mark .spark-a{background:#211a38}

.brand-lockup{text-align:center;line-height:1}.brand-lockup .brand{position:relative;display:inline-block}
.cross-tm{font-size:.2em;position:absolute;right:-.9em;top:.05em;color:var(--signal);font-weight:900;letter-spacing:0}
.subbrand{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:.5rem;font-weight:900;letter-spacing:.18em}

/* Completion celebration: same logo, motion only after a correct finished puzzle */
.completion-orbit{display:none;margin:12px auto 2px;width:112px;height:74px}
.result.correct + .completion-orbit{display:block}
.completion-orbit.celebrate .planet-core{animation:planetPulse .72s ease-in-out 2}
.completion-orbit.celebrate .orbit{animation:orbitSpin 1.35s cubic-bezier(.2,.8,.2,1)}
.completion-orbit.celebrate .moon{animation:moonPop .55s ease-out 2}
.completion-orbit.celebrate .spark{animation:sparkFlash .45s ease-in-out 3}
@keyframes planetPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13);filter:brightness(1.22)}}
@keyframes orbitSpin{0%{transform:rotate(-14deg) scaleX(1)}50%{transform:rotate(166deg) scaleX(1.05)}100%{transform:rotate(346deg) scaleX(1)}}
@keyframes moonPop{0%,100%{transform:scale(1)}50%{transform:scale(1.7);box-shadow:0 0 22px rgba(66,229,141,.9)}}
@keyframes sparkFlash{0%,100%{opacity:.25;transform:rotate(45deg) scale(.7)}50%{opacity:1;transform:rotate(45deg) scale(1.8)}}

const recent=JSON.parse(localStorage.getItem("cwRecentAnswers")||"[]"),recentSet=new Set(recent);
pool.sort((a,b)=>(recentSet.has(a[0])?1:0)-(recentSet.has(b[0])?1:0));
function can(w,r,c,dr,dc){
  let cr=0,ori=dr?"D":"A";
  let by=r-dr,bx=c-dc,ay=r+dr*w.length,ax=c+dc*w.length;
  if(by>=0&&bx>=0&&by<n&&bx<n&&g[by][bx])return-1;
  if(ay>=0&&ax>=0&&ay<n&&ax<n&&g[ay][ax])return-1;
  for(let k=0;k<w.length;k++){
    let y=r+dr*k,x=c+dc*k;
    if(y<0||x<0||y>=n||x>=n)return-1;
    let q=g[y][x];
    if(q&&q!=w[k])return-1;
    if(q){
      if((ori==="A"&&occA[y][x])||(ori==="D"&&occD[y][x]))return-1;
      cr++;
    }else{
      if(!dr&&((y&&g[y-1][x])||(y<n-1&&g[y+1][x])))return-1;
      if(dr&&((x&&g[y][x-1])||(x<n-1&&g[y][x+1])))return-1;
    }
  }
  return cr
}
function put(o,r,c,dr,dc){
  for(let k=0;k<o[0].length;k++){
    let y=r+dr*k,x=c+dc*k;
    g[y][x]=o[0][k];
    if(dr)occD[y][x]=true;else occA[y][x]=true;
  }
  E.push({a:o[0],cl:o[1],r,c,dr,dc})
}
let f=pool.shift();put(f,Math.floor(n/2),Math.floor((n-f[0].length)/2),0,1);
for(let pass=0;pass<10&&E.length<n*1.45;pass++)for(let o of sh(pool,R)){
  if(E.some(e=>e.a==o[0]))continue;
  let z=[];
  for(let e of E)for(let a=0;a<o[0].length;a++)for(let b=0;b<e.a.length;b++)if(o[0][a]==e.a[b]){
    let dr=e.dr?0:1,dc=e.dr?1:0,y=e.r+e.dr*b-dr*a,x=e.c+e.dc*b-dc*a,q=can(o[0],y,x,dr,dc);
    if(q>0)z.push([q,y,x,dr,dc])
  }
  if(z.length){z.sort((a,b)=>b[0]-a[0]);let q=z[0];put(o,q[1],q[2],q[3],q[4]);if(E.length>=n*1.45)break}
}
let nums={},nn=1;E.sort((a,b)=>a.r-b.r||a.c-b.c);
for(let e of E){let k=e.r+","+e.c;if(!nums[k])nums[k]=nn++;e.num=nums[k];e.dir=e.dr?"D":"A";e.clue=(d==="Hard"||d==="Expert")?e.cl.replace(/^Place /,"Location ").replace(/^Time /,"Period "):e.cl}
return{n,g,E,d}}
function validLayout(b){
  const entryKeys=new Set(b.E.map(e=>`${e.dir}:${e.r},${e.c}:${e.a.length}`));
  const runKeys=new Set();
  for(let r=0;r<b.n;r++)for(let c=0;c<b.n;c++){
    if(!b.g[r][c])continue;
    if((c===0||!b.g[r][c-1])){
      let len=0;while(c+len<b.n&&b.g[r][c+len])len++;
      if(len>1)runKeys.add(`A:${r},${c}:${len}`);
    }
    if((r===0||!b.g[r-1][c])){
      let len=0;while(r+len<b.n&&b.g[r+len][c])len++;
      if(len>1)runKeys.add(`D:${r},${c}:${len}`);
    }
  }
  if(entryKeys.size!==b.E.length)return false;
  if(entryKeys.size!==runKeys.size)return false;
  for(const k of entryKeys)if(!runKeys.has(k))return false;
  return true
}
function mk(n,d,seed,title){
  for(let attempt=0;attempt<250;attempt++){
    const actualSeed=seed+"|layout-"+attempt,b=build(n,d,actualSeed);
    if(validLayout(b))return Object.assign({title,seed:actualSeed,t:n>=13?"Long Form":n>=10?"Standard":"Quick"},b)
  }
  throw new Error("Unable to generate a valid crossword layout")
}const P=[mk(7,"Hard","a","Short & Sharp"),mk(9,"Easy","b","Coffee Break"),mk(11,"Expert","c","The Long Read"),mk(13,"Medium","d","Sunday Desk"),mk(15,"Easy","e","Leisure Edition")];
function key(){return cur.title+cur.seed}function cards(){$("#cards").innerHTML=P.map((p,i)=>`<div class="card" data-i="${i}"><small>No. 0${i+1} · ${p.d}</small><h2>${p.title}</h2><p>${p.t} · ${p.n} × ${p.n}</p></div>`).join("");document.querySelectorAll(".card").forEach(x=>x.onclick=()=>open(P[+x.dataset.i]))}cards();
let activeEntry=null;
function entryCells(e){return Array.from({length:e.a.length},(_,k)=>(e.r+e.dr*k)*cur.n+(e.c+e.dc*k))}
function open(p){if(!validLayout(p))throw new Error("Invalid crossword layout blocked");cur=p;document.body.classList.toggle("game-mobile",isMobileUI());dir=tab="A";activeEntry=p.E.find(e=>e.dir==="A")||p.E[0];dir=tab=activeEntry.dir;sel=activeEntry.r*p.n+activeEntry.c;$("#home").classList.add("off");$("#game").classList.add("on");$("#title").textContent=p.title;$("#meta").textContent=p.d+" · "+p.t+" · "+p.n+" × "+p.n+" · BUILD 24 VISUAL FIX";$("#grid").style.setProperty("--n",p.n);
let recent=JSON.parse(localStorage.getItem("cwRecentAnswers")||"[]");
recent=[...p.E.map(e=>e.a),...recent.filter(w=>!p.E.some(e=>e.a===w))].slice(0,120);
localStorage.setItem("cwRecentAnswers",JSON.stringify(recent));
draw()}
function at(i,D){return cur.E.find(e=>e.dir===D&&entryCells(e).includes(i))}
function ce(){if(activeEntry&&entryCells(activeEntry).includes(sel))return activeEntry;activeEntry=at(sel,dir)||at(sel,dir==="A"?"D":"A")||cur.E[0];dir=tab=activeEntry.dir;return activeEntry}
function isMobileUI(){return window.matchMedia("(max-width:700px)").matches} function focusInput(){if(!isMobileUI())$("#kbd").focus()} function selectEntry(e,pos){if(!e)return;activeEntry=e;dir=tab=e.dir;let cells=entryCells(e);sel=pos!=null&&cells.includes(pos)?pos:cells[0];clues();paint();focusInput()}
function nextEntry(step=1){if(!cur||!activeEntry)return;let orientation=activeEntry.dir;let list=cur.E.filter(e=>e.dir===orientation).sort((a,b)=>a.num-b.num);let i=list.indexOf(activeEntry);if(i<0)i=0;selectEntry(list[(i+step+list.length)%list.length])}
function answer(i){let r=Math.floor(i/cur.n),c=i%cur.n;return cur.g[r][c]}
function completionState(){
  if(!cur)return "incomplete";
  const pr=st.p[key()]||{};
  let hasEmpty=false,hasWrong=false;
  for(let i=0;i<cur.n*cur.n;i++){
    const a=answer(i);
    if(!a)continue;
    if(!pr[i])hasEmpty=true;
    else if(pr[i]!==a)hasWrong=true;
  }
  if(hasEmpty)return "incomplete";
  return hasWrong?"incorrect":"correct";
}
function setResult(message,state=""){
  const box=$("#result");
  box.textContent=message;
  box.className="result show"+(state?" "+state:"");
}
function showCompletion(){
  const state=completionState(),box=$("#result");
  if(state==="correct"){setResult("CORRECT — PUZZLE COMPLETE.","correct");let co=document.querySelector(".completion-orbit");if(co&&!co.classList.contains("celebrate")){co.classList.add("celebrate");setTimeout(()=>co.classList.remove("celebrate"),2900)}}
  else if(state==="incorrect")setResult("INCORRECT — THE GRID IS COMPLETE, BUT SOMETHING IS WRONG.","incorrect");
  else {box.textContent="";box.className="result";}
}
function draw(){let pr=st.p[key()]||{},g=$("#grid"),nums={};cur.E.forEach(e=>nums[e.r+","+e.c]=e.num);g.innerHTML="";for(let i=0;i<cur.n*cur.n;i++){let r=Math.floor(i/cur.n),c=i%cur.n,x=document.createElement("div"),a=cur.g[r][c];if(!a){x.className="cell block";g.appendChild(x);continue}x.className="cell";x.innerHTML=(nums[r+","+c]?`<span class="num">${nums[r+","+c]}</span>`:"")+(pr[i]||"");x.onclick=()=>{let chosen;if(sel===i&&at(i,dir==="A"?"D":"A")){chosen=at(i,dir==="A"?"D":"A")}else{chosen=at(i,dir)||at(i,dir==="A"?"D":"A")}selectEntry(chosen,i)};g.appendChild(x)}clues();paint();showCompletion()}
function clues(){$("#ta").classList.toggle("on",tab==="A");$("#td").classList.toggle("on",tab==="D");let list=cur.E.filter(e=>e.dir===tab).sort((a,b)=>a.num-b.num);$("#cluelist").innerHTML=list.map(e=>`<div class="clue" data-n="${e.num}"><b>${e.num}</b>${e.clue}</div>`).join("");document.querySelectorAll(".clue").forEach(x=>x.onclick=()=>selectEntry(list.find(e=>e.num===+x.dataset.n)))}
function paint(){let e=activeEntry;if(!e)return;dir=tab=e.dir;let cells=new Set(entryCells(e));document.querySelectorAll(".cell").forEach((x,i)=>{x.classList.toggle("word",cells.has(i));x.classList.toggle("sel",i===sel)});document.querySelectorAll(".clue").forEach(x=>x.classList.toggle("hot",+x.dataset.n===e.num));$("#current").textContent=(e.dir==="A"?"Across ":"Down ")+e.num+" · "+e.clue}
function move(step){let e=ce(),r=Math.floor(sel/cur.n),c=sel%cur.n,k=(r-e.r)*e.dr+(c-e.c)*e.dc;k=Math.max(0,Math.min(e.a.length-1,k+step));sel=(e.r+e.dr*k)*cur.n+(e.c+e.dc*k)}
function entryComplete(e,pr){return entryCells(e).every(i=>!!pr[i])}
function selectFirstLogical(e,pr){const cells=entryCells(e),firstEmpty=cells.find(i=>!pr[i]);selectEntry(e,firstEmpty!=null?firstEmpty:cells[0])}
function advanceEntryLogical(){if(!cur)return;const here=ce(),pr=st.p[key()]||{};const same=cur.E.filter(e=>e.dir===here.dir).sort((a,b)=>a.num-b.num);let idx=same.findIndex(e=>e.num===here.num&&e.dir===here.dir),target;if(idx>=0&&idx<same.length-1)target=same[idx+1];else{const other=here.dir==="A"?"D":"A";target=cur.E.filter(e=>e.dir===other).sort((a,b)=>a.num-b.num)[0]||same[0]}if(target)selectFirstLogical(target,pr)}
function moveAfterType(){let e=ce(),cells=entryCells(e),k=cells.indexOf(sel),pr=st.p[key()]||{};for(let j=k+1;j<cells.length;j++){if(!pr[cells[j]]){sel=cells[j];return}}if(entryComplete(e,pr))advanceEntryLogical()}
function typeLetter(ch){if(!cur||!/^[A-Z]$/.test(ch)||!answer(sel))return;let pr=st.p[key()]||{};pr[sel]=ch;st.p[key()]=pr;moveAfterType();save();draw();focusInput()}
$("#kbd").addEventListener("input",e=>{let ch=e.target.value.slice(-1).toUpperCase();e.target.value="";typeLetter(ch)});

function mobileBackspace(){if(!cur)return;const pr=st.p[key()]||(st.p[key()]={});if(pr[sel])delete pr[sel];else{const prev=previousPlayableInEntry();if(prev!==null){sel=prev;delete pr[sel]}}save();draw()}
function buildMobileKeyboard(){const box=$("#mobileKbd");if(!box)return;const rows=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];box.innerHTML="";rows.join("").split("").forEach(ch=>{const b=document.createElement("button");b.type="button";b.textContent=ch;b.setAttribute("aria-label",ch);b.onclick=()=>typeLetter(ch);box.appendChild(b)});const back=document.createElement("button");back.type="button";back.className="key-back";back.textContent="⌫";back.setAttribute("aria-label","Backspace");back.onclick=mobileBackspace;box.appendChild(back)}
buildMobileKeyboard();

$("#ta").onclick=()=>{let e=at(sel,"A")||cur.E.find(e=>e.dir==="A");selectEntry(e,sel)};
$("#td").onclick=()=>{let e=at(sel,"D")||cur.E.find(e=>e.dir==="D");selectEntry(e,sel)};
$("#start").onclick=$("#today").onclick=()=>open(P[1]);
$("#fresh").onclick=$("#generate").onclick=()=>{
  let n=[7,9,11,13,15][Math.floor(Math.random()*5)],
      d=["Easy","Medium","Hard","Expert"][Math.floor(Math.random()*4)];
  open(mk(n,d,Date.now()+"","Fresh Edition"));
};
$("#archive").onclick=$("#back").onclick=()=>{
  $("#game").classList.remove("on");
  $("#home").classList.remove("off");
  document.body.classList.remove("game-mobile");
  cur=null;
};

function entryIndex(dir,entry){
  const list=cur.E.filter(e=>e.dir===dir);
  return list.findIndex(e=>e===entry || (e.num===entry.num&&e.dir===entry.dir));
}
function cycleEntry(){
  if(!cur)return;
  const here=ce(), orientation=here.dir;
  const same=cur.E.filter(e=>e.dir===orientation).sort((a,b)=>a.num-b.num);
  let idx=same.findIndex(e=>e.num===here.num&&e.dir===here.dir);
  let target=null;
  if(idx>=0 && idx<same.length-1) target=same[idx+1];
  else {
    const other=orientation==="A"?"D":"A";
    const opp=cur.E.filter(e=>e.dir===other).sort((a,b)=>a.num-b.num);
    target=opp[0]||same[0];
  }
  if(target)selectEntry(target);
}
function previousPlayableInEntry(){
  const cells=entryCells(ce()),i=cells.indexOf(sel);
  return i>0?cells[i-1]:null;
}
function nextPlayableInEntry(){
  const cells=entryCells(ce()),i=cells.indexOf(sel);
  return i>=0&&i<cells.length-1?cells[i+1]:null;
}
$("#kbd").addEventListener("keydown",e=>{
  if(!cur)return;
  const pr=st.p[key()]||(st.p[key()]={});

  if(e.key==="Tab"){
    e.preventDefault();
    cycleEntry();
    return;
  }

  if(e.key==="Backspace"){
    e.preventDefault();
    if(pr[sel]){
      // One press always deletes the currently selected letter.
      delete pr[sel];
      save();draw();focusInput();
      return;
    }
    // If current cell is already empty, move back one cell and erase it immediately.
    const prev=previousPlayableInEntry();
    if(prev!==null){
      sel=prev;
      if(pr[sel])delete pr[sel];
      save();draw();focusInput();
    }
    return;
  }

  if(e.key==="Delete"){
    e.preventDefault();
    if(pr[sel])delete pr[sel];
    save();draw();focusInput();
    return;
  }

  if(/^[a-zA-Z]$/.test(e.key)){
    e.preventDefault();
    // Always overwrite the selected cell, even when it was previously filled.
    pr[sel]=e.key.toUpperCase();
    save();

    // Advance exactly one physical cell in the active answer. Do NOT skip
    // pre-filled intersections; they remain directly editable on click.
    moveAfterType();
    draw();focusInput();
    return;
  }

  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){
    e.preventDefault();
    const n=cur.n,r=Math.floor(sel/n),c=sel%n;
    let rr=r,cc=c;
    if(e.key==="ArrowLeft")cc--; if(e.key==="ArrowRight")cc++;
    if(e.key==="ArrowUp")rr--; if(e.key==="ArrowDown")rr++;
    if(rr>=0&&cc>=0&&rr<n&&cc<n&&answer(rr*n+cc)){
      sel=rr*n+cc;
      dir=tab=(e.key==="ArrowUp"||e.key==="ArrowDown")?"D":"A";activeEntry=at(sel,dir)||activeEntry;
      draw();focusInput();
    }
  }
});
$("#hint").onclick=()=>{
  if(!cur)return;
  const pr=st.p[key()]||{};
  pr[sel]=answer(sel);
  st.p[key()]=pr;save();draw();focusInput();
};
$("#reveal").onclick=()=>{
  if(!cur)return;
  const pr=st.p[key()]||{},e=ce();
  for(const i of entryCells(e))pr[i]=answer(i);
  st.p[key()]=pr;save();draw();focusInput();
};
$("#clear").onclick=()=>{
  if(!cur)return;
  if(confirm("Clear this puzzle?")){
    st.p[key()]={};save();draw();setResult("PUZZLE CLEARED.");focusInput();
  }
};
$("#check").onclick=()=>{
  if(!cur)return;
  const state=completionState();
  if(state==="incomplete")setResult("NOT FINISHED — THERE ARE STILL EMPTY CELLS.");
  else if(state==="correct")setResult("CORRECT — PUZZLE COMPLETE.","correct");
  else setResult("INCORRECT — THE GRID IS COMPLETE, BUT SOMETHING IS WRONG.","incorrect");
  focusInput();
};
</script></body></html>
