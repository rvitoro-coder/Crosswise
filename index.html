<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Crosswise</title>
<style>
:root{--desk:#0d0b09;--paper:#1b1814;--paper2:#252019;--ink:#f0e2c6;--muted:#aa9675;--rule:#6c5940;--accent:#b698cd;--active:#594568;--word:#342b3c;--cell:#2a241c;--block:#070605}
html.light{--desk:#c9b493;--paper:#eee0c3;--paper2:#f8ecd5;--ink:#211910;--muted:#74624a;--rule:#a28660;--accent:#78549a;--active:#d8c2e2;--word:#e8ddeb;--cell:#fbf0db;--block:#1a1611}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#5a3a1d44,transparent 30%),var(--desk);color:var(--ink);font-family:Georgia,serif}.app{max-width:1050px;margin:18px auto;padding:24px 28px;background:var(--paper);min-height:calc(100vh - 36px);box-shadow:0 24px 70px #0009;border:1px solid var(--rule)}header{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;border-bottom:3px double var(--ink);padding-bottom:12px}.brand{font-size:clamp(35px,6vw,60px);letter-spacing:.07em}.brand i{font-style:normal;color:var(--accent)}.motto{font-style:italic;color:var(--muted);font-size:13px}.right{text-align:right}.date{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}button{font:inherit}.theme{margin-top:6px;background:none;color:var(--ink);border:1px solid var(--rule);padding:6px 10px}.nav{display:flex;gap:22px;padding:11px 0;border-bottom:1px solid var(--rule)}.nav button{border:0;background:none;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10px}.hero{display:grid;grid-template-columns:1fr 170px;gap:25px;align-items:center;padding:40px 4%;border-bottom:1px solid var(--rule)}.k{color:var(--accent);font-size:10px;letter-spacing:.17em;text-transform:uppercase;font-weight:bold}.hero h1{font-size:clamp(44px,7vw,74px);font-weight:400;line-height:.92;letter-spacing:-.04em;margin:9px 0 16px}.hero p{color:var(--muted);line-height:1.55;font-size:16px}.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.primary,.secondary{padding:10px 14px;text-transform:uppercase;letter-spacing:.1em;font-size:10px}.primary{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}.secondary{background:none;color:var(--ink);border:1px solid var(--rule)}.art{display:grid;place-items:center;position:relative;height:170px}.moon{width:115px;height:115px;border:1px solid var(--rule);border-radius:50%;box-shadow:inset -23px 0 0 #9a6eb520;position:relative}.moon:before,.moon:after{content:"";position:absolute;inset:-13px;border:1px solid var(--rule);border-radius:50%;opacity:.4}.moon:after{inset:-27px;opacity:.16}.stars{position:absolute;color:var(--accent);letter-spacing:11px;transform:rotate(-17deg)}.head{display:flex;gap:12px;align-items:center;margin:23px 0 10px;font-size:10px;text-transform:uppercase;letter-spacing:.15em}.head:after{content:"";height:1px;background:var(--rule);flex:1}.cards{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule)}.card{padding:17px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);cursor:pointer}.card small{color:var(--accent);text-transform:uppercase;letter-spacing:.1em}.card h2{font-weight:400;margin:7px 0}.card p{color:var(--muted);font-size:12px}.game{display:none;padding-top:18px}.game.on{display:block}.home.off{display:none}.gamehead{text-align:center;margin:8px 0 18px}.gamehead h1{font-weight:400;margin:5px;font-size:35px}.play{display:grid;grid-template-columns:minmax(310px,570px) 1fr;gap:25px}.grid{display:grid;grid-template-columns:repeat(5,1fr);aspect-ratio:1;background:var(--ink);gap:1px;border:2px solid var(--ink)}.cell{background:var(--cell);display:grid;place-items:center;position:relative;font-family:Arial,sans-serif;font-size:clamp(20px,5vw,32px);font-weight:bold;text-transform:uppercase}.cell.word{background:var(--word)}.cell.sel{background:var(--active)}.num{position:absolute;top:2px;left:3px;font-size:8px;color:var(--muted)}.current{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:11px;margin-top:12px;text-align:center}.tools{display:flex;justify-content:center;flex-wrap:wrap}.tools button{border:0;border-right:1px solid var(--rule);background:none;color:var(--muted);padding:8px;font-size:9px;text-transform:uppercase}.clues{border-top:3px double var(--ink)}.tabs{display:flex;border-bottom:1px solid var(--rule)}.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px}.tabs .on{color:var(--accent);border-bottom:2px solid var(--accent)}.clue{padding:8px 4px;border-bottom:1px dotted var(--rule)}.clue.hot{background:var(--word)}.clue b{display:inline-block;width:26px;color:var(--accent)}#kbd{position:fixed;left:-1000px;opacity:0}
@media(max-width:700px){.app{margin:0;min-height:100vh;padding:15px 13px;border:0}.motto{display:none}header{grid-template-columns:1fr auto}.brand{font-size:34px}.hero{grid-template-columns:1fr 80px;padding:30px 1%}.hero h1{font-size:43px}.hero p{font-size:14px}.art{height:100px}.moon{width:67px;height:67px}.cards{grid-template-columns:1fr}.play{grid-template-columns:1fr}.nav{overflow:auto;white-space:nowrap}}
</style></head><body><div class="app"><header><div class="motto">Good words. Quiet hours.</div><div class="brand">CROSS<i>WISE</i></div><div class="right"><div class="date" id="date"></div><button class="theme" id="theme">Light</button></div></header><nav class="nav"><button id="today">Today</button><button id="generate">Generate</button><button id="archive">Archive</button></nav>
<main class="home" id="home"><section class="hero"><div><div class="k">The Evening Edition · No advertisements</div><h1>Slow down.<br>Solve more.</h1><p>A quiet little newspaper for clever words. Pick an edition from the archive or ask the press for another.</p><div class="actions"><button class="primary" id="start">Begin today’s puzzle</button><button class="secondary" id="fresh">Set the press</button></div></div><div class="art"><div class="moon"></div><div class="stars">✦ ✧ ✦</div></div></section><div class="head">From the archive</div><div class="cards" id="cards"></div></main>
<main class="game" id="game"><button class="secondary" id="back">← Archive</button><div class="gamehead"><div class="k" id="meta"></div><h1 id="title"></h1></div><div class="play"><div><div class="grid" id="grid"></div><div class="current" id="current"></div><div class="tools"><button id="check">Check</button><button id="hint">Hint</button><button id="reveal">Reveal word</button><button id="clear">Clear</button></div></div><aside class="clues"><div class="tabs"><button id="ta" class="on">Across</button><button id="td">Down</button></div><div id="cluelist"></div></aside></div></main></div><input id="kbd" inputmode="text" autocapitalize="characters" autocomplete="off">
<script>
const P=[{title:"Morning Paper",d:"Easy",t:"General",r:["APPLE","PLANE","PLANT","LEARN","ENTER"],c:["Orchard fruit","Aircraft","Greenery in a pot","Acquire knowledge","Go in"]},{title:"After Hours",d:"Medium",t:"Night",r:["HEART","EARTH","ARISE","RINSE","THESE"],c:["Core organ","Our planet","Get up","Wash lightly","Counterpart of those"]},{title:"Ancient Square",d:"Hard",t:"Words",r:["SATOR","AREPO","TENET","OPERA","ROTAS"],c:["Ancient palindrome opener","Name in an old word square","Principle","Stage works","Wheels, in Latin"]},{title:"Natural History",d:"Medium",t:"Nature",r:["LEMUR","ELATE","MARES","UTERI","RESIN"],c:["Madagascan primate","Make very happy","Female horses","Plural anatomical term","Sticky plant secretion"]}];
const $=s=>document.querySelector(s);let cur=null,sel=0,dir="A",tab="A";let st=JSON.parse(localStorage.getItem("cw4")||'{"theme":"dark","p":{}}');
function save(){localStorage.setItem("cw4",JSON.stringify(st))}function setTheme(){document.documentElement.classList.toggle("light",st.theme==="light");$("#theme").textContent=st.theme==="dark"?"Light":"Dark"}$("#theme").onclick=()=>{st.theme=st.theme==="dark"?"light":"dark";save();setTheme()};setTheme();$("#date").textContent=new Intl.DateTimeFormat("en-CA",{month:"long",day:"numeric",year:"numeric"}).format(new Date());
function key(){return cur.title}function cards(){$("#cards").innerHTML=P.map((p,i)=>`<div class="card" data-i="${i}"><small>No. 0${i+1} · ${p.d}</small><h2>${p.title}</h2><p>${p.t} · 5 × 5</p></div>`).join("");document.querySelectorAll(".card").forEach(x=>x.onclick=()=>open(P[+x.dataset.i]))}cards();
function open(p){cur=p;sel=0;dir="A";tab="A";$("#home").classList.add("off");$("#game").classList.add("on");$("#title").textContent=p.title;$("#meta").textContent=p.d+" · "+p.t+" · 5 × 5";draw()}function ans(i){return cur.r[Math.floor(i/5)][i%5]}
function draw(){let pr=st.p[key()]||{},g=$("#grid");g.innerHTML="";for(let i=0;i<25;i++){let x=document.createElement("div");x.className="cell";x.innerHTML=(i<5?`<span class="num">${i+1}</span>`:"")+(pr[i]||"");x.onclick=()=>{if(sel===i)dir=dir==="A"?"D":"A";sel=i;tab=dir;clues();paint();$("#kbd").focus()};g.appendChild(x)}clues();paint()}
function clues(){$("#ta").classList.toggle("on",tab==="A");$("#td").classList.toggle("on",tab==="D");$("#cluelist").innerHTML=cur.c.map((c,i)=>`<div class="clue" data-n="${i}"><b>${i+1}</b>${c}</div>`).join("")}
function paint(){let r=Math.floor(sel/5),c=sel%5;document.querySelectorAll(".cell").forEach((x,i)=>{let rr=Math.floor(i/5),cc=i%5;x.classList.toggle("word",dir==="A"?rr===r:cc===c);x.classList.toggle("sel",i===sel)});let n=dir==="A"?r:c;document.querySelectorAll(".clue").forEach(x=>x.classList.toggle("hot",+x.dataset.n===n));$("#current").textContent=(dir==="A"?"Across ":"Down ")+(n+1)+" · "+cur.c[n]}
function move(n){let r=Math.floor(sel/5),c=sel%5;if(dir==="A")c=Math.max(0,Math.min(4,c+n));else r=Math.max(0,Math.min(4,r+n));sel=r*5+c}
$("#kbd").addEventListener("input",e=>{let ch=e.target.value.slice(-1).toUpperCase();e.target.value="";if(!cur||!/^[A-Z]$/.test(ch))return;let pr=st.p[key()]||{};pr[sel]=ch;st.p[key()]=pr;move(1);save();draw();$("#kbd").focus()});
$("#kbd").addEventListener("keydown",e=>{if(e.key==="Backspace"&&cur){let pr=st.p[key()]||{};if(pr[sel])delete pr[sel];else move(-1);st.p[key()]=pr;save();draw();e.preventDefault()}});
$("#ta").onclick=()=>{tab=dir="A";clues();paint()};$("#td").onclick=()=>{tab=dir="D";clues();paint()};$("#start").onclick=$("#today").onclick=()=>open(P[0]);$("#fresh").onclick=$("#generate").onclick=()=>open(P[Math.floor(Math.random()*P.length)]);$("#archive").onclick=$("#back").onclick=()=>{$("#game").classList.remove("on");$("#home").classList.remove("off");cur=null};
$("#hint").onclick=()=>{let pr=st.p[key()]||{};pr[sel]=ans(sel);st.p[key()]=pr;save();draw()};$("#reveal").onclick=()=>{let pr=st.p[key()]||{},r=Math.floor(sel/5),c=sel%5;for(let j=0;j<5;j++){let i=dir==="A"?r*5+j:j*5+c;pr[i]=ans(i)}st.p[key()]=pr;save();draw()};$("#clear").onclick=()=>{if(confirm("Clear this puzzle?")){st.p[key()]={};save();draw()}};$("#check").onclick=()=>{let pr=st.p[key()]||{};document.querySelectorAll(".cell").forEach((x,i)=>{if(pr[i])x.classList.add(pr[i]===ans(i)?"correct":"wrong")})};
</script></body></html>
