<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Crosswise</title>
<style>
:root{--desk:#0d0b09;--paper:#1b1814;--paper2:#252019;--ink:#f0e2c6;--muted:#aa9675;--rule:#6c5940;--accent:#b698cd;--active:#594568;--word:#342b3c;--cell:#2a241c;--block:#070605}
html.light{--desk:#c9b493;--paper:#eee0c3;--paper2:#f8ecd5;--ink:#211910;--muted:#74624a;--rule:#a28660;--accent:#78549a;--active:#d8c2e2;--word:#e8ddeb;--cell:#fbf0db;--block:#1a1611}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#5a3a1d44,transparent 30%),var(--desk);color:var(--ink);font-family:Georgia,serif}.app{max-width:1050px;margin:18px auto;padding:24px 28px;background:var(--paper);min-height:calc(100vh - 36px);box-shadow:0 24px 70px #0009;border:1px solid var(--rule)}header{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;border-bottom:3px double var(--ink);padding-bottom:12px}.brand{font-size:clamp(35px,6vw,60px);letter-spacing:.07em}.brand i{font-style:normal;color:var(--accent)}.motto{font-style:italic;color:var(--muted);font-size:13px}.right{text-align:right}.date{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}button{font:inherit}.theme{margin-top:6px;background:none;color:var(--ink);border:1px solid var(--rule);padding:6px 10px}.nav{display:flex;gap:22px;padding:11px 0;border-bottom:1px solid var(--rule)}.nav button{border:0;background:none;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10px}.hero{display:grid;grid-template-columns:1fr 170px;gap:25px;align-items:center;padding:40px 4%;border-bottom:1px solid var(--rule)}.k{color:var(--accent);font-size:10px;letter-spacing:.17em;text-transform:uppercase;font-weight:bold}.hero h1{font-size:clamp(44px,7vw,74px);font-weight:400;line-height:.92;letter-spacing:-.04em;margin:9px 0 16px}.hero p{color:var(--muted);line-height:1.55;font-size:16px}.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.primary,.secondary{padding:10px 14px;text-transform:uppercase;letter-spacing:.1em;font-size:10px}.primary{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}.secondary{background:none;color:var(--ink);border:1px solid var(--rule)}.art{display:grid;place-items:center;position:relative;height:170px}.moon{width:115px;height:115px;border:1px solid var(--rule);border-radius:50%;box-shadow:inset -23px 0 0 #9a6eb520;position:relative}.moon:before,.moon:after{content:"";position:absolute;inset:-13px;border:1px solid var(--rule);border-radius:50%;opacity:.4}.moon:after{inset:-27px;opacity:.16}.stars{position:absolute;color:var(--accent);letter-spacing:11px;transform:rotate(-17deg)}.head{display:flex;gap:12px;align-items:center;margin:23px 0 10px;font-size:10px;text-transform:uppercase;letter-spacing:.15em}.head:after{content:"";height:1px;background:var(--rule);flex:1}.cards{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule)}.card{padding:17px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);cursor:pointer}.card small{color:var(--accent);text-transform:uppercase;letter-spacing:.1em}.card h2{font-weight:400;margin:7px 0}.card p{color:var(--muted);font-size:12px}.game{display:none;padding-top:18px}.game.on{display:block}.home.off{display:none}.gamehead{text-align:center;margin:8px 0 18px}.gamehead h1{font-weight:400;margin:5px;font-size:35px}.play{display:grid;grid-template-columns:minmax(310px,570px) 1fr;gap:25px}.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);aspect-ratio:1;background:var(--ink);gap:1px;border:2px solid var(--ink)}.cell{background:var(--cell);min-width:0;display:grid;place-items:center;position:relative;font-family:Arial,sans-serif;font-size:clamp(10px,calc(34px - var(--n)*1.25px),30px);font-weight:bold;text-transform:uppercase}.cell.block{background:var(--block);pointer-events:none}.cell.word{background:var(--word)}.cell.sel{background:var(--active)}.num{position:absolute;top:2px;left:3px;font-size:8px;color:var(--muted)}.current{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:11px;margin-top:12px;text-align:center}.tools{display:flex;justify-content:center;flex-wrap:wrap}.tools button{border:0;border-right:1px solid var(--rule);background:none;color:var(--muted);padding:8px;font-size:9px;text-transform:uppercase}.clues{border-top:3px double var(--ink)}.tabs{display:flex;border-bottom:1px solid var(--rule)}.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px}.tabs .on{color:var(--accent);border-bottom:2px solid var(--accent)}.clue{padding:8px 4px;border-bottom:1px dotted var(--rule)}.clue.hot{background:var(--word)}.clue b{display:inline-block;width:26px;color:var(--accent)}#kbd{position:fixed;left:-1000px;opacity:0}
@media(max-width:700px){.grid{max-width:calc(100vw - 26px);margin:auto}.num{font-size:6px;top:1px;left:2px}.app{margin:0;min-height:100vh;padding:15px 13px;border:0}.motto{display:none}header{grid-template-columns:1fr auto}.brand{font-size:34px}.hero{grid-template-columns:1fr 80px;padding:30px 1%}.hero h1{font-size:43px}.hero p{font-size:14px}.art{height:100px}.moon{width:67px;height:67px}.cards{grid-template-columns:1fr}.play{grid-template-columns:1fr}.nav{overflow:auto;white-space:nowrap}}
</style></head><body><div class="app"><header><div class="motto">Good words. Quiet hours.</div><div class="brand">CROSS<i>WISE</i></div><div class="right"><div class="date" id="date"></div><button class="theme" id="theme">Light</button></div></header><nav class="nav"><button id="today">Today</button><button id="generate">Generate</button><button id="archive">Archive</button></nav>
<main class="home" id="home"><section class="hero"><div><div class="k">The Evening Edition · No advertisements</div><h1>Slow down.<br>Solve more.</h1><p>A quiet little newspaper for clever words. Pick an edition from the archive or ask the press for another.</p><div class="actions"><button class="primary" id="start">Begin today’s puzzle</button><button class="secondary" id="fresh">Set the press</button></div></div><div class="art"><div class="moon"></div><div class="stars">✦ ✧ ✦</div></div></section><div class="head">From the archive</div><div class="cards" id="cards"></div></main>
<main class="game" id="game"><button class="secondary" id="back">← Archive</button><div class="gamehead"><div class="k" id="meta"></div><h1 id="title"></h1></div><div class="play"><div><div class="grid" id="grid"></div><div class="current" id="current"></div><div class="tools"><button id="check">Check</button><button id="hint">Hint</button><button id="reveal">Reveal word</button><button id="clear">Clear</button></div></div><aside class="clues"><div class="tabs"><button id="ta" class="on">Across</button><button id="td">Down</button></div><div id="cluelist"></div></aside></div></main></div><input id="kbd" tabindex="-1" inputmode="text" autocapitalize="characters" autocomplete="off">
<script>
const W=[
["APPLE","Orchard fruit"],["PLANE","Aircraft"],["PLANT","Greenery in a pot"],["LEARN","Acquire knowledge"],["ENTER","Go in"],["HEART","Core organ"],["EARTH","Our planet"],["ARISE","Get up"],["RINSE","Wash lightly"],["NIGHT","Time after sunset"],["LIGHT","Opposite of dark"],["STONE","Rock"],["WATER","Clear drink"],["HOUSE","Place to live"],["MOUSE","Small rodent"],["TRAIN","Rail transport"],["BRAIN","Thinking organ"],["GRAIN","Wheat or rice unit"],["CHAIR","Seat for one"],["TABLE","Dining furniture"],["CLOUD","Sky formation"],["STORM","Severe weather"],["RIVER","Flowing waterway"],["OCEAN","Vast salt water"],["BEACH","Sandy shore"],["MUSIC","Organized sound"],["PIANO","Keyboard instrument"],["DRUMS","Percussion kit"],["GUITAR","Six-string instrument"],["STRING","Thin cord"],["PURPLE","Red-blue colour"],["ORANGE","Citrus fruit"],["SILVER","Grey precious metal"],["WINTER","Coldest season"],["SUMMER","Warmest season"],["SPRING","Season after winter"],["AUTUMN","Fall season"],["FOREST","Large wooded area"],["DESERT","Very dry region"],["ISLAND","Land surrounded by water"],["VALLEY","Low land between hills"],["CASTLE","Fortified residence"],["BRIDGE","Crossing over a gap"],["MARKET","Place of trade"],["SCHOOL","Place of learning"],["OFFICE","Workplace"],["GARDEN","Cultivated plot"],["WINDOW","Opening with glass"],["BUTTON","Pressable control"],["PLANET","World orbiting a star"],["COMET","Icy celestial body"],["SPACE","Area or cosmos"],["MOON","Natural satellite"],["STAR","Luminous celestial body"],["NORTH","Compass direction"],["SOUTH","Compass direction"],["EAST","Compass direction"],["WEST","Compass direction"],["QUIET","Making little noise"],["WORDS","Units of language"],["LOGIC","Reasoning system"],["CLUES","Puzzle prompts"],["SOLVE","Find the answer"],["CROSS","Go from one side to another"],["DAILY","Every day"],["PAPER","Writing material"],["PRESS","Push firmly"],["LETTER","Alphabet character"],["ANSWER","Response to a question"],["SECRET","Something hidden"],["MYSTERY","Something unexplained"],["PUZZLE","Brain teaser"],["RIDDLE","Enigmatic question"],["NUMBER","Mathematical value"],["CIRCLE","Round shape"],["SQUARE","Four equal sides"],["CORNER","Where two edges meet"],["CENTER","Middle point"],["POCKET","Small clothing pouch"],["JACKET","Outer garment"],["COFFEE","Caffeinated drink"],["DINNER","Evening meal"],["BOTTLE","Container with a neck"],["CAMERA","Photo device"],["SCREEN","Display surface"],["MOBILE","Portable"],["PLAYER","Game participant"],["RANDOM","Without fixed pattern"],["HIDDEN","Not visible"],["THREAD","Thin strand"],["POETRY","Verse writing"],["NOVEL","Long fictional work"],["AUTHOR","Writer"],["EDITOR","Text reviser"],["COLUMN","Vertical series"],["ARCHIVE","Stored collection"],["EVENING","Late part of day"],["MORNING","Early part of day"],["HORIZON","Where sky seems to meet land"],["JOURNAL","Periodical or diary"],["LIBRARY","Book collection"],["LANGUAGE","System of communication"],["CROSSWORD","Interlocking word puzzle"]];
const $=s=>document.querySelector(s);let cur=null,sel=0,dir="A",tab="A";let st=JSON.parse(localStorage.getItem("cw6")||'{"theme":"dark","p":{}}');
function save(){localStorage.setItem("cw6",JSON.stringify(st))}function setTheme(){document.documentElement.classList.toggle("light",st.theme==="light");$("#theme").textContent=st.theme==="dark"?"Light":"Dark"}$("#theme").onclick=()=>{st.theme=st.theme==="dark"?"light":"dark";save();setTheme()};setTheme();$("#date").textContent=new Intl.DateTimeFormat("en-CA",{month:"long",day:"numeric",year:"numeric"}).format(new Date());
function rng(seed){let x=0;for(let c of seed)x=(x*31+c.charCodeAt(0))|0;return()=>((x=(Math.imul(x,1664525)+1013904223)|0)>>>0)/4294967296}function sh(a,r){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(n,d,seed){let R=rng(seed),g=Array.from({length:n},()=>Array(n).fill(null)),E=[],pool=sh(W.filter(x=>x[0].length<=Math.min(n,9)),R);function can(w,r,c,dr,dc){let cr=0;for(let k=0;k<w.length;k++){let y=r+dr*k,x=c+dc*k;if(y<0||x<0||y>=n||x>=n)return-1;let q=g[y][x];if(q&&q!=w[k])return-1;if(q==w[k])cr++;if(!q){if(!dr&&((y&&g[y-1][x])||(y<n-1&&g[y+1][x])))return-1;if(dr&&((x&&g[y][x-1])||(x<n-1&&g[y][x+1])))return-1}}return cr}function put(o,r,c,dr,dc){for(let k=0;k<o[0].length;k++)g[r+dr*k][c+dc*k]=o[0][k];E.push({a:o[0],cl:o[1],r,c,dr,dc})}let f=pool.shift();put(f,Math.floor(n/2),Math.floor((n-f[0].length)/2),0,1);for(let pass=0;pass<7&&E.length<n*1.45;pass++)for(let o of sh(pool,R)){if(E.some(e=>e.a==o[0]))continue;let z=[];for(let e of E)for(let a=0;a<o[0].length;a++)for(let b=0;b<e.a.length;b++)if(o[0][a]==e.a[b]){let dr=e.dr?0:1,dc=e.dr?1:0,y=e.r+e.dr*b-dr*a,x=e.c+e.dc*b-dc*a,q=can(o[0],y,x,dr,dc);if(q>0)z.push([q,y,x,dr,dc])}if(z.length){z.sort((a,b)=>b[0]-a[0]);let q=z[0];put(o,q[1],q[2],q[3],q[4]);if(E.length>=n*1.45)break}}let nums={},nn=1;E.sort((a,b)=>a.r-b.r||a.c-b.c);for(let e of E){let k=e.r+","+e.c;if(!nums[k])nums[k]=nn++;e.num=nums[k];e.dir=e.dr?"D":"A";e.clue=(d==="Hard"||d==="Expert")?e.cl.replace(/^Place /,"Location ").replace(/^Time /,"Period "):e.cl}return{n,g,E,d}}
function mk(n,d,seed,title){return Object.assign({title,seed,t:n>=13?"Long Form":n>=10?"Standard":"Quick"},build(n,d,seed))}const P=[mk(7,"Hard","a","Short & Sharp"),mk(9,"Easy","b","Coffee Break"),mk(11,"Expert","c","The Long Read"),mk(13,"Medium","d","Sunday Desk"),mk(15,"Easy","e","Leisure Edition")];
function key(){return cur.title+cur.seed}function cards(){$("#cards").innerHTML=P.map((p,i)=>`<div class="card" data-i="${i}"><small>No. 0${i+1} · ${p.d}</small><h2>${p.title}</h2><p>${p.t} · ${p.n} × ${p.n}</p></div>`).join("");document.querySelectorAll(".card").forEach(x=>x.onclick=()=>open(P[+x.dataset.i]))}cards();
let activeEntry=null;
function entryCells(e){return Array.from({length:e.a.length},(_,k)=>(e.r+e.dr*k)*cur.n+(e.c+e.dc*k))}
function open(p){cur=p;dir=tab="A";activeEntry=p.E.find(e=>e.dir==="A")||p.E[0];dir=tab=activeEntry.dir;sel=activeEntry.r*p.n+activeEntry.c;$("#home").classList.add("off");$("#game").classList.add("on");$("#title").textContent=p.title;$("#meta").textContent=p.d+" · "+p.t+" · "+p.n+" × "+p.n;$("#grid").style.setProperty("--n",p.n);draw()}
function at(i,D){return cur.E.find(e=>e.dir===D&&entryCells(e).includes(i))}
function ce(){if(activeEntry&&entryCells(activeEntry).includes(sel))return activeEntry;activeEntry=at(sel,dir)||at(sel,dir==="A"?"D":"A")||cur.E[0];dir=tab=activeEntry.dir;return activeEntry}
function selectEntry(e,pos){if(!e)return;activeEntry=e;dir=tab=e.dir;let cells=entryCells(e);sel=pos!=null&&cells.includes(pos)?pos:cells[0];clues();paint();$("#kbd").focus()}
function nextEntry(step=1){if(!cur||!activeEntry)return;let orientation=activeEntry.dir;let list=cur.E.filter(e=>e.dir===orientation).sort((a,b)=>a.num-b.num);let i=list.indexOf(activeEntry);if(i<0)i=0;selectEntry(list[(i+step+list.length)%list.length])}
function answer(i){let r=Math.floor(i/cur.n),c=i%cur.n;return cur.g[r][c]}
function draw(){let pr=st.p[key()]||{},g=$("#grid"),nums={};cur.E.forEach(e=>nums[e.r+","+e.c]=e.num);g.innerHTML="";for(let i=0;i<cur.n*cur.n;i++){let r=Math.floor(i/cur.n),c=i%cur.n,x=document.createElement("div"),a=cur.g[r][c];if(!a){x.className="cell block";g.appendChild(x);continue}x.className="cell";x.innerHTML=(nums[r+","+c]?`<span class="num">${nums[r+","+c]}</span>`:"")+(pr[i]||"");x.onclick=()=>{let chosen;if(sel===i&&at(i,dir==="A"?"D":"A")){chosen=at(i,dir==="A"?"D":"A")}else{chosen=at(i,dir)||at(i,dir==="A"?"D":"A")}selectEntry(chosen,i)};g.appendChild(x)}clues();paint()}
function clues(){$("#ta").classList.toggle("on",tab==="A");$("#td").classList.toggle("on",tab==="D");let list=cur.E.filter(e=>e.dir===tab).sort((a,b)=>a.num-b.num);$("#cluelist").innerHTML=list.map(e=>`<div class="clue" data-n="${e.num}"><b>${e.num}</b>${e.clue}</div>`).join("");document.querySelectorAll(".clue").forEach(x=>x.onclick=()=>selectEntry(list.find(e=>e.num===+x.dataset.n)))}
function paint(){let e=activeEntry;if(!e)return;dir=tab=e.dir;let cells=new Set(entryCells(e));document.querySelectorAll(".cell").forEach((x,i)=>{x.classList.toggle("word",cells.has(i));x.classList.toggle("sel",i===sel)});document.querySelectorAll(".clue").forEach(x=>x.classList.toggle("hot",+x.dataset.n===e.num));$("#current").textContent=(e.dir==="A"?"Across ":"Down ")+e.num+" · "+e.clue}
function move(step){let e=ce(),r=Math.floor(sel/cur.n),c=sel%cur.n,k=(r-e.r)*e.dr+(c-e.c)*e.dc;k=Math.max(0,Math.min(e.a.length-1,k+step));sel=(e.r+e.dr*k)*cur.n+(e.c+e.dc*k)}
$("#kbd").addEventListener("input",e=>{let ch=e.target.value.slice(-1).toUpperCase();e.target.value="";if(!cur||!/^[A-Z]$/.test(ch)||!answer(sel))return;let pr=st.p[key()]||{};pr[sel]=ch;st.p[key()]=pr;move(1);save();draw();$("#kbd").focus()});
$("#kbd").addEventListener("keydown",e=>{if(!cur)return;if(e.key==="Backspace"){let pr=st.p[key()]||{};if(pr[sel])delete pr[sel];else move(-1);st.p[key()]=pr;save();draw();e.preventDefault()}});
// Capture Tab before the browser can move focus to page controls. This is the crossword navigation key.
window.addEventListener("keydown",e=>{if(!cur||e.key!=="Tab")return;e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();nextEntry(e.shiftKey?-1:1);},{capture:true});
$("#ta").onclick=()=>{let e=at(sel,"A")||cur.E.find(e=>e.dir==="A");selectEntry(e,sel)};$("#td").onclick=()=>{let e=at(sel,"D")||cur.E.find(e=>e.dir==="D");selectEntry(e,sel)};$("#start").onclick=$("#today").onclick=()=>open(P[1]);$("#fresh").onclick=$("#generate").onclick=()=>{let n=[7,9,11,13,15][Math.floor(Math.random()*5)],d=["Easy","Medium","Hard","Expert"][Math.floor(Math.random()*4)];open(mk(n,d,Date.now()+"","Fresh Edition"))};$("#archive").onclick=$("#back").onclick=()=>{$("#game").classList.remove("on");$("#home").classList.remove("off");cur=null};
$("#hint").onclick=()=>{let pr=st.p[key()]||{};pr[sel]=answer(sel);st.p[key()]=pr;save();draw()};$("#reveal").onclick=()=>{let pr=st.p[key()]||{},e=ce();for(let k=0;k<e.a.length;k++)pr[(e.r+e.dr*k)*cur.n+e.c+e.dc*k]=e.a[k];st.p[key()]=pr;save();draw()};$("#clear").onclick=()=>{if(confirm("Clear this puzzle?")){st.p[key()]={};save();draw()}};$("#check").onclick=()=>{let pr=st.p[key()]||{};document.querySelectorAll(".cell").forEach((x,i)=>{if(pr[i]&&answer(i))x.classList.add(pr[i]===answer(i)?"correct":"wrong")})};
</script></body></html>
