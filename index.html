/* INTERLET signature orbital mark, copied from the actual Interlet identity */
.interlet-mark{position:relative;width:112px;height:74px;margin:0 auto;isolation:isolate}
.interlet-mark .planet-core{position:absolute;z-index:2;left:31px;top:7px;width:58px;height:58px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 31% 25%,#d8ccff 0 5%,#9b72ff 15%,#713cff 40%,#3d1a8b 72%,#160b35 100%);box-shadow:inset -10px -8px 18px rgba(9,4,25,.55),0 0 30px rgba(124,77,255,.28)}
.interlet-mark .planet-cut{position:absolute;inset:0;border-radius:50%;background:linear-gradient(155deg,transparent 0 45%,rgba(255,255,255,.09) 46% 49%,transparent 50% 61%,rgba(66,229,141,.16) 62% 65%,transparent 66%);transform:rotate(-8deg)}
.interlet-mark .orbit{position:absolute;left:8px;top:29px;width:99px;height:22px;border:3px solid #fff;border-radius:50%;transform:rotate(-14deg);box-sizing:border-box}
.interlet-mark .orbit-back{z-index:1;opacity:.72;border-color:#a98dff}
.interlet-mark .orbit-front{z-index:3;clip-path:inset(50% -8px -8px -8px);border-color:#fff;filter:drop-shadow(0 1px 2px rgba(255,255,255,.16))}
.interlet-mark .moon{position:absolute;z-index:4;right:2px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--signal);box-shadow:0 0 12px rgba(66,229,141,.5)}
.interlet-mark .spark{position:absolute;z-index:0;background:#fff;transform:rotate(45deg);opacity:.85}
.interlet-mark .spark-a{width:4px;height:4px;left:10px;top:10px}.interlet-mark .spark-b{width:3px;height:3px;right:13px;bottom:8px;background:var(--signal);opacity:.7}
html.light .interlet-mark .orbit-front{border-color:#211a38}html.light .interlet-mark .orbit-back{border-color:#7c4dff}html.light .interlet-mark .spark-a{background:#211a38}

.brand-lockup{text-align:center;line-height:1}.brand-lockup .brand{position:relative;display:inline-block}
.cross-tm{font-size:.2em;position:absolute;right:-.9em;top:.05em;color:var(--signal);font-weight:900;letter-spacing:0}
.subbrand{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:.5rem;font-weight:900;letter-spacing:.18em}

/* Completion celebration: same logo, motion only after a correct finished puzzle */
.completion-orbit{display:none;margin:12px auto 2px;width:112px;height:74px}
.result.correct + .completion-orbit{display:block}
.completion-orbit.celebrate .planet-core{animation:planetPulse .72s ease-in-out 2}
.completion-orbit.celebrate .orbit{animation:orbitSpin 1.35s cubic-bezier(.2,.8,.2,1)}
.completion-orbit.celebrate .moon{animation:moonPop .55s ease-out 2}
.completion-orbit.celebrate .spark{animation:sparkFlash .45s ease-in-out 3}
@keyframes planetPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13);filter:brightness(1.22)}}
@keyframes orbitSpin{0%{transform:rotate(-14deg) scaleX(1)}50%{transform:rotate(166deg) scaleX(1.05)}100%{transform:rotate(346deg) scaleX(1)}}
@keyframes moonPop{0%,100%{transform:scale(1)}50%{transform:scale(1.7);box-shadow:0 0 22px rgba(66,229,141,.9)}}
@keyframes sparkFlash{0%,100%{opacity:.25;transform:rotate(45deg) scale(.7)}50%{opacity:1;transform:rotate(45deg) scale(1.8)}}

function mergeRows(...groups){
  const seen=new Set(),out=[];
  for(const group of groups)for(const row of group||[]){
    if(!row||!row[0]||!row[1])continue;
    const answer=String(row[0]).toUpperCase(), clue=String(row[1]).trim();
    if(seen.has(answer))continue;
    if(!/^[A-Z]+$/.test(answer)||answer.length<3||answer.length>15)continue;
    if(!clue||clue.length>58||clue.split(/\s+/).length>8)continue;
    if(new RegExp(`\\b${answer}\\b`,"i").test(clue))continue;
    seen.add(answer);out.push([answer,clue,row[2]||"vocabulary"]);
  }
  return out;
}

      delete pr[sel];

    }
    // If current cell is already empty, move back one cell and erase it immediately.
    const prev=previousPlayableInEntry();
    if(prev!==null){
      sel=prev;
      if(pr[sel])delete pr[sel];
      save();draw();focusInput();
    }
    return;
  }

  if(e.key==="Delete"){
    e.preventDefault();
    if(pr[sel])delete pr[sel];
    save();draw();focusInput();

    e.preventDefault();

  else if(state==="correct"){finishTimedSolve();const t=timerState();setResult(t.assisted?"PUZZLE COMPLETE · ASSISTED":"PUZZLE COMPLETE · "+formatSolveTime(t.completedSeconds),"correct");}
  else setResult("INCORRECT — THE GRID IS COMPLETE, BUT SOMETHING IS WRONG.","incorrect");
  focusInput();
};
</script></body></html>
